<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter. Your shop's agent behind the counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/onboard.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Counter<span class="dot">.</span></h1>
  </div>
  <p class="tag">Customers ask about prices, hours, and delivery. Your agent answers from your real menu.</p>
  <div class="card" id="card">
    <form id="f">
      <div class="url-block">
        <label for="url">Menu link</label>
        <div class="url-row">
          <input id="url" type="url" placeholder="https://slicelife.com/restaurants/…" autocomplete="off">
        </div>
        <button type="button" class="btn-primary" id="pull" style="margin-top:14px">Pull from link</button>
      </div>

      <button type="button" class="btn-secondary" id="toggleManual" aria-expanded="false" aria-controls="manual">
        Enter manually
      </button>

      <div class="manual" id="manual" hidden>
        <div class="manual-inner">
          <label for="name">Shop name</label>
          <input id="name" placeholder="Tony's Pizza" maxlength="80">

          <label for="hours">Hours</label>
          <input id="hours" placeholder="Mon-Sat 11am-10pm, Sun 12-9" maxlength="200">

          <label for="menu">Menu <span class="soft">(items and prices)</span></label>
          <textarea id="menu" class="tall" placeholder="Cheese slice $3.50&#10;Large pepperoni $22&#10;Calzone $12"></textarea>

          <label for="policies">Policies / FAQ <span class="soft">(delivery, payment, allergens)</span></label>
          <textarea id="policies" placeholder="Delivery within 2 miles on phone orders. Cash and card. GF crust +$4."></textarea>

          <label for="contact">Address / phone</label>
          <input id="contact" placeholder="292 Main St, Cambridge · (617) 555-0123" maxlength="200">

          <div class="spin-wrap">
            <button type="submit" class="btn-primary" id="go">Open my counter</button>
          </div>
        </div>
      </div>

      <div class="err" id="err" role="alert"></div>
      <div class="ok" id="status" role="status"></div>
    </form>
  </div>
  <p class="hint"><a href="/shops">Browse shops that are live</a></p>
</div>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
const status = document.getElementById('status');
const pull = document.getElementById('pull');
const manual = document.getElementById('manual');
const toggle = document.getElementById('toggleManual');

const set = (id, v) => { if (v != null && v !== '') document.getElementById(id).value = v; };

function openManual() {
  manual.hidden = false;
  requestAnimationFrame(() => manual.classList.add('open'));
  toggle.setAttribute('aria-expanded', 'true');
  toggle.textContent = 'Hide manual entry';
  document.getElementById('name').required = true;
  document.getElementById('hours').required = true;
  document.getElementById('menu').required = true;
}

function closeManual() {
  manual.classList.remove('open');
  toggle.setAttribute('aria-expanded', 'false');
  toggle.textContent = 'Enter manually';
  document.getElementById('name').required = false;
  document.getElementById('hours').required = false;
  document.getElementById('menu').required = false;
  const done = () => {
    if (!manual.classList.contains('open')) manual.hidden = true;
    manual.removeEventListener('transitionend', done);
  };
  manual.addEventListener('transitionend', done);
  setTimeout(() => { if (!manual.classList.contains('open')) manual.hidden = true; }, 400);
}

toggle.onclick = () => {
  if (manual.classList.contains('open')) closeManual();
  else openManual();
};

pull.onclick = async () => {
  err.textContent = '';
  status.textContent = '';
  const url = document.getElementById('url').value.trim();
  if (!url) { err.textContent = 'Paste a menu link first.'; return; }
  pull.disabled = true;
  pull.textContent = 'Reading…';
  try {
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not read that page');
    set('name', d.name);
    set('hours', d.hours);
    set('menu', d.menu);
    set('policies', d.policies);
    set('contact', d.contact);
    openManual();
    status.textContent = 'Check the details below, then open your counter'
      + (d.warnings?.length ? ` (${d.warnings.length} warning${d.warnings.length === 1 ? '' : 's'})` : '');
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    pull.disabled = false;
    pull.textContent = 'Pull from link';
  }
};

f.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  status.textContent = '';
  if (!manual.classList.contains('open')) {
    err.textContent = 'Pull from a link or enter manually first.';
    return;
  }
  const go = document.getElementById('go');
  go.disabled = true;
  go.textContent = 'Opening…';
  try {
    const body = {
      name: document.getElementById('name').value.trim(),
      hours: document.getElementById('hours').value.trim(),
      menu: document.getElementById('menu').value.trim(),
      policies: document.getElementById('policies').value.trim(),
      contact: document.getElementById('contact').value.trim(),
    };
    const r = await fetch('/api/shops', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Could not create shop');
    status.innerHTML = `You're live. <a href="${d.chatUrl}">Chat with your counter</a>`;
    f.reset();
    closeManual();
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    go.disabled = false;
    go.textContent = 'Open my counter';
  }
};
</script>
</body>
</html>
