<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter — every shop gets its own agent</title>
<style>
  :root { --bg:#faf6ef; --card:#fff; --ink:#26211a; --dim:#8a7f70; --hot:#c8401d; --ok:#2e7d4f; --line:#e8dfd2; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.55 -apple-system, "SF Pro Text", Georgia, serif;
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:600px; }
  h1 { font-size:36px; letter-spacing:-.5px; }
  h1 .dot { color:var(--hot); }
  .tag { color:var(--dim); margin:6px 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:0 2px 14px rgba(60,40,10,.05); }
  label { display:block; font-size:12.5px; color:var(--dim); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.09em; }
  input { width:100%; background:#fdfbf7; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:11px 13px; font:inherit; }
  input:focus { outline:none; border-color:var(--hot); }
  button { margin-top:20px; width:100%; background:var(--hot); color:#fff; border:0; border-radius:10px; padding:14px; font:600 17px/1 inherit; cursor:pointer; }
  button:hover { filter:brightness(1.06); }
  button:disabled { opacity:.65; cursor:wait; }
  .err { color:#b3261e; margin-top:12px; font-size:14px; min-height:1em; }
  .ok { color:var(--ok); margin-top:12px; font-size:14px; min-height:1em; }
  .hint { font-size:13px; color:var(--dim); margin-top:14px; text-align:center; }
  .hint a { color:inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Counter<span class="dot">.</span></h1>
  <div class="tag">Paste a restaurant link — Slice menus get full sizes/toppings; other sites use page scrape. Check the console.</div>
  <div class="card" id="card">
    <form id="f">
      <label>Restaurant URL</label>
      <input id="url" type="url" placeholder="https://…" required>
      <button type="submit" id="go">Pull shop info</button>
      <div class="err" id="err"></div>
      <div class="ok" id="status"></div>
    </form>
  </div>
  <div class="hint">each shop = its own persistent Maritime agent · <a href="/shops">live shop directory</a></div>
</div>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
const status = document.getElementById('status');
f.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  status.textContent = '';
  const go = document.getElementById('go');
  const url = document.getElementById('url').value.trim();
  go.disabled = true;
  go.textContent = 'Reading page…';
  try {
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ url }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'scrape failed');
    console.log('[extract]', d);
    status.textContent = 'Scraped — check console' + (d.warnings?.length ? ` (${d.warnings.length} warning${d.warnings.length === 1 ? '' : 's'})` : '');
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    go.disabled = false;
    go.textContent = 'Pull shop info';
  }
};
</script>
</body>
</html>
