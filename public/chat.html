<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} — ask us anything</title>
<style>
  :root { --bg:#faf6ef; --ink:#26211a; --dim:#8a7f70; --hot:#c8401d; --line:#e8dfd2; --me:#c8401d; --them:#fff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, "SF Pro Text", Georgia, serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; background:#fff; border-bottom:1px solid var(--line); }
  header h1 { font-size:20px; } header h1 span { color:var(--hot); }
  header .sub { font-size:13px; color:var(--dim); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 14px; border-radius:16px; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .them { align-self:flex-start; background:var(--them); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .typing { align-self:flex-start; color:var(--dim); font-size:14px; padding:4px 8px; }
  .msg a { color:inherit; text-decoration:underline; font-weight:600; }
  form { display:flex; gap:10px; padding:12px 14px; background:#fff; border-top:1px solid var(--line); }
  input { flex:1; border:1px solid var(--line); border-radius:999px; padding:12px 16px; font:inherit; background:#fdfbf7; }
  input:focus { outline:none; border-color:var(--hot); }
  button { background:var(--hot); color:#fff; border:0; border-radius:999px; padding:0 20px; font:600 15px inherit; cursor:pointer; }
  .foot { text-align:center; font-size:11.5px; color:var(--dim); padding:6px 0 10px; background:#fff; }
</style>
</head>
<body>
<header>
  <h1>{{NAME}}<span>.</span></h1>
  <div class="sub">{{HOURS}} · usually replies in ~15s</div>
</header>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="Do you have gluten-free crust?" autocomplete="off">
  <button>Send</button>
</form>
<div class="foot">served by {{NAME}}'s own agent · hosted on Maritime</div>
<script>
const SLUG = '{{SLUG}}';
const log = document.getElementById('log');
const history = [];
const LINK_RE = /(https?:\/\/[^\s)]+|\(\d{3}\)\s?\d{3}-\d{4}|\b\d{3}-\d{3}-\d{4}\b)/g;
const bubble = (cls, text) => {
  const d = document.createElement('div'); d.className = 'msg ' + cls;
  String(text).split(LINK_RE).forEach((part) => {
    if (!part) return;
    if (/^https?:\/\//.test(part)) {
      const a = document.createElement('a'); a.href = part; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = part.replace(/^https?:\/\/(www\.)?/, '').split('/')[0];
      d.appendChild(a);
    } else if (/^[\d(]/.test(part) && /\d{3}-\d{4}$/.test(part)) {
      const a = document.createElement('a'); a.href = 'tel:+1' + part.replace(/\D/g, '');
      a.textContent = part; d.appendChild(a);
    } else d.appendChild(document.createTextNode(part));
  });
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
};
bubble('them', "Hey! I'm the agent behind the counter at {{NAME}}. Ask me about the menu, hours, delivery — anything.");
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q');
  const text = q.value.trim(); if (!text) return;
  q.value = '';
  bubble('me', text);
  history.push({ role: 'user', text });
  const t = document.createElement('div'); t.className = 'typing'; t.textContent = 'typing…'; log.appendChild(t); log.scrollTop = log.scrollHeight;
  const ask = async () => {
    const r = await fetch('/api/chat', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ slug: SLUG, message: text, history: history.slice(0, -1) }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'failed');
    return d;
  };
  try {
    let d;
    try { d = await ask(); }
    catch { t.textContent = 'waking the shop\u2019s agent\u2026'; await new Promise(r => setTimeout(r, 2500)); d = await ask(); }
    t.remove();
    bubble('them', d.reply);
    history.push({ role: 'agent', text: d.reply });
  } catch (ex) { t.remove(); bubble('them', '⚠️ ' + ex.message + ' — try once more, or call the shop.'); }
};
</script>
</body>
</html>
