<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}. Ask the counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<header>
  <h1>{{NAME}}<span>.</span></h1>
  <div class="sub">{{HOURS}}</div>
</header>
<div id="log" aria-live="polite"></div>
<div class="composer">
  <form id="f">
    <input id="q" placeholder="Do you have gluten-free crust?" autocomplete="off" enterkeyhint="send">
    <button type="submit" id="send">Send</button>
  </form>
  <div class="foot">{{NAME}} · behind the counter</div>
</div>
<script>
const SLUG = '{{SLUG}}';
const log = document.getElementById('log');
const history = [];
const sendBtn = document.getElementById('send');

const bubble = (cls, text) => {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
};

const typingEl = () => {
  const t = document.createElement('div');
  t.className = 'typing';
  t.setAttribute('aria-label', 'typing');
  t.innerHTML = '<span></span><span></span><span></span>';
  log.appendChild(t);
  log.scrollTop = log.scrollHeight;
  return t;
};

bubble('them', "Hey! What can I get for you? Menu, hours, delivery… ask away.");

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const q = document.getElementById('q');
  const text = q.value.trim();
  if (!text) return;
  q.value = '';
  bubble('me', text);
  history.push({ role: 'user', text });
  sendBtn.disabled = true;
  const t = typingEl();

  const ask = async () => {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ slug: SLUG, message: text, history: history.slice(0, -1) }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'failed');
    return d;
  };

  try {
    let d;
    try {
      d = await ask();
    } catch {
      t.classList.add('wake');
      t.textContent = 'waking the shop\u2019s agent\u2026';
      await new Promise(r => setTimeout(r, 2500));
      d = await ask();
    }
    t.remove();
    bubble('them', d.reply);
    history.push({ role: 'agent', text: d.reply });
  } catch (ex) {
    t.remove();
    bubble('them', '\u26a0\ufe0f ' + ex.message + ' \u2014 try once more, or call the shop.');
  } finally {
    sendBtn.disabled = false;
    q.focus();
  }
};
</script>
</body>
</html>
