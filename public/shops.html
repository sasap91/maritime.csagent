<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter. Shops you can ask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shops.css">
</head>
<body>
<div class="page">
  <div class="brand">
    <h1>Counter<span>.</span> shops</h1>
  </div>
  <p class="sub">
    <span class="count" id="n">0</span> counters open. Ask about the menu, hours, or delivery.
    <a href="/">Add yours</a>
  </p>
  <div class="grid" id="grid"></div>
  <footer>Pick a shop and ask like you would at the counter.</footer>
</div>
<script>
let fingerprint = '';
async function tick() {
  try {
    const shops = await (await fetch('/api/shops')).json();
    document.getElementById('n').textContent = shops.length;
    const next = shops.map(s => s.slug + '|' + s.name + '|' + s.hours).join('\n');
    if (next === fingerprint) return;
    fingerprint = next;
    const grid = document.getElementById('grid');
    if (!shops.length) {
      grid.innerHTML = '<p class="empty">No shops yet. <a href="/">Open the first counter</a>.</p>';
      return;
    }
    grid.innerHTML = shops.map((s, i) =>
      `<article class="shop" style="animation-delay:${0.08 + i * 0.07}s">
        <h2>${s.name}</h2>
        <div class="hrs">${s.hours}</div>
        <a href="/s/${s.slug}">Ask this shop</a>
      </article>`
    ).join('');
  } catch {}
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
